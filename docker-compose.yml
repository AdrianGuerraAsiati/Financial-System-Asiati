services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://asiati:asiati@db:5432/financial_system
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financial_system
      POSTGRES_USER: asiati
      POSTGRES_PASSWORD: asiati
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asiati -d financial_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
