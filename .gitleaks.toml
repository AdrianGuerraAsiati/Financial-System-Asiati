[[allowlists]]
description = "Known synthetic JWT fixture false positive in historical auth test commit"
condition = "AND"
commits = ["ac7ea1821cefe1e9d504d1f539f1f3c0b90dc4fd"]
paths = ['''^tests/test_core_auth_api\.py$''']
