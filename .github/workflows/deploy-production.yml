name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::890876258895:role/financial-system-asiati-github-deploy
  INSTANCE_ID: i-0aa49867c85421e59
  DEPLOY_BUCKET: financial-system-asiati-prod-backups-890876258895-us-east-2

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deploy commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Build private release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/financial-system-${{ steps.target.outputs.sha }}.tar.gz"

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=secrets \
            --exclude=fixtures \
            -czf "$ARCHIVE" .

          ARTIFACT_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release artifact
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          KEY="deploy/${{ steps.target.outputs.sha }}/source.tar.gz"
          URI="s3://$DEPLOY_BUCKET/$KEY"

          aws s3 cp \
            "${{ steps.artifact.outputs.archive }}" \
            "$URI" \
            --region "$AWS_REGION" \
            --sse AES256 \
            --only-show-errors

          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact through SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_URI="${{ steps.upload.outputs.uri }}"
          RELEASE_SHA="${{ steps.target.outputs.sha }}"
          RELEASE_SHA256="${{ steps.artifact.outputs.sha256 }}"

          PARAMETERS="$(
            jq -cn \
              --arg uri "$RELEASE_URI" \
              --arg sha "$RELEASE_SHA" \
              --arg checksum "$RELEASE_SHA256" \
              '{
                commands: [
                  "set -euo pipefail",
                  "rm -rf /tmp/financial-system-release",
                  "mkdir -p /tmp/financial-system-release/inspect",
                  ("aws s3 cp " + $uri + " /tmp/financial-system-release/source.tar.gz --region us-east-2 --only-show-errors"),
                  ("echo \"" + $checksum + "  /tmp/financial-system-release/source.tar.gz\" | sha256sum -c -"),
                  "tar -xzf /tmp/financial-system-release/source.tar.gz -C /tmp/financial-system-release/inspect",
                  ("bash /tmp/financial-system-release/inspect/ops/install_release_artifact.sh /tmp/financial-system-release/source.tar.gz " + $sha)
                ]
              }'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy Financial System ASIATI private artifact" \
              --parameters "$PARAMETERS" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          STATUS="Pending"
          for _ in $(seq 1 180); do
            STATUS="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || echo Pending
            )"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          test "$STATUS" = "Success"

      - name: Deployment summary
        if: always()
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `${{ steps.target.outputs.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: `${{ steps.upload.outputs.uri }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instance: `$INSTANCE_ID`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: `$AWS_REGION`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSM command: `${{ steps.deploy.outputs.command_id }}`" >> "$GITHUB_STEP_SUMMARY"
