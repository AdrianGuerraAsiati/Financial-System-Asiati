name: Deploy development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: development-lightsail
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::890876258895:role/financial-system-asiati-github-deploy
  LIGHTSAIL_INSTANCE: financial-system-asiati-dev
  LIGHTSAIL_HOST: 3.141.226.208
  DEVELOPMENT_DOMAIN: 3-141-226-208.sslip.io
  DEV_DATA_BUCKET: financial-system-asiati-dev-data-890876258895
  DEV_COMPRAS_S3_KEY: dev/compras/source/INFORME_COMPRAS_2024_2026.xlsx
  DEV_COMPRAS_LOCAL_NAME: INFORME_COMPRAS_2024_2026_DEV.xlsx
  COGNITO_REGION: us-east-2
  COGNITO_USER_POOL_ID: us-east-2_KXOYOSosH
  COGNITO_CLIENT_ID: 3vkuevu6bnb1lpe0o82krognvl

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deploy commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Build release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/financial-system-${{ steps.target.outputs.sha }}.tar.gz"

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=secrets \
            --exclude=fixtures \
            -czf "$ARCHIVE" .

          ARTIFACT_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Cognito client secret
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_SECRET="$(
            aws cognito-idp describe-user-pool-client \
              --region "$COGNITO_REGION" \
              --user-pool-id "$COGNITO_USER_POOL_ID" \
              --client-id "$COGNITO_CLIENT_ID" \
              --query 'UserPoolClient.ClientSecret' \
              --output text
          )"
          test -n "$CLIENT_SECRET"
          test "$CLIENT_SECRET" != "None"
          printf '%s' "$CLIENT_SECRET" > /tmp/cognito-client-secret
          chmod 600 /tmp/cognito-client-secret

      - name: Inspect Compras workbook in S3
        id: compras_source
        shell: bash
        run: |
          set -euo pipefail
          METADATA="$(
            aws s3api head-object               --bucket "$DEV_DATA_BUCKET"               --key "$DEV_COMPRAS_S3_KEY"
          )"
          ETAG="$(jq -r '.ETag' <<<"$METADATA" | tr -d '"')"
          SIZE="$(jq -r '.ContentLength' <<<"$METADATA")"
          test -n "$ETAG"
          test "$SIZE" -gt 0
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Workbook S3: $SIZE bytes, ETag $ETAG"

      - name: Get temporary Lightsail SSH access
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="$(
            aws lightsail get-instance-access-details \
              --region "$AWS_REGION" \
              --instance-name "$LIGHTSAIL_INSTANCE" \
              --protocol ssh
          )"

          USERNAME="$(jq -r '.accessDetails.username // empty' <<<"$DETAILS")"
          PRIVATE_KEY="$(jq -r '.accessDetails.privateKey // empty' <<<"$DETAILS")"
          CERT_KEY="$(jq -r '.accessDetails.certKey // empty' <<<"$DETAILS")"

          test -n "$USERNAME"
          test -n "$PRIVATE_KEY"

          printf '%s\n' "$PRIVATE_KEY" > /tmp/lightsail.pem
          chmod 600 /tmp/lightsail.pem
          ssh-keygen -y -f /tmp/lightsail.pem >/dev/null

          if [[ -n "$CERT_KEY" ]]; then
            printf '%s\n' "$CERT_KEY" > /tmp/lightsail.pem-cert.pub
            chmod 644 /tmp/lightsail.pem-cert.pub
          else
            rm -f /tmp/lightsail.pem-cert.pub
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "host=$LIGHTSAIL_HOST" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=accept-new \
              -i /tmp/lightsail.pem \
              "${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}" \
              "echo ready" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Lightsail no aceptó SSH a tiempo." >&2
          exit 1

      - name: Copy Cognito client secret to Lightsail
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            /tmp/cognito-client-secret \
            "${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}:/tmp/cognito-client-secret"
          rm -f /tmp/cognito-client-secret

      - name: Check Compras workbook cache on Lightsail
        id: compras_cache
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"
          REMOTE_ETAG="$(
            ssh               -o BatchMode=yes               -o StrictHostKeyChecking=accept-new               -i /tmp/lightsail.pem               "$SSH_TARGET"               "sudo cat /opt/financial-system-data/compras/.source-etag 2>/dev/null || true"
          )"

          if [[ "$REMOTE_ETAG" == "${{ steps.compras_source.outputs.etag }}" ]]             && ssh               -o BatchMode=yes               -o StrictHostKeyChecking=accept-new               -i /tmp/lightsail.pem               "$SSH_TARGET"               "sudo test -s /opt/financial-system-data/compras/$DEV_COMPRAS_LOCAL_NAME"; then
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "La copia operacional ya corresponde al objeto actual de S3."
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
            echo "Se actualizará la copia operacional desde S3."
          fi

      - name: Prepare Compras workbook from S3
        if: steps.compras_cache.outputs.sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp             "s3://$DEV_DATA_BUCKET/$DEV_COMPRAS_S3_KEY"             /tmp/compras-source.xlsx             --only-show-errors

          python -m pip install --disable-pip-version-check --quiet "openpyxl>=3.1,<4.0"
          python ops/preparar_excel_compras_dev.py             --source /tmp/compras-source.xlsx             --output "/tmp/$DEV_COMPRAS_LOCAL_NAME"

          test -s "/tmp/$DEV_COMPRAS_LOCAL_NAME"
          rm -f /tmp/compras-source.xlsx

      - name: Install Compras workbook on Lightsail
        if: steps.compras_cache.outputs.sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"

          scp             -o BatchMode=yes             -o StrictHostKeyChecking=accept-new             -i /tmp/lightsail.pem             "/tmp/$DEV_COMPRAS_LOCAL_NAME"             "$SSH_TARGET:/tmp/$DEV_COMPRAS_LOCAL_NAME"

          ssh             -o BatchMode=yes             -o StrictHostKeyChecking=accept-new             -i /tmp/lightsail.pem             "$SSH_TARGET"             "sudo DEV_COMPRAS_LOCAL_NAME='$DEV_COMPRAS_LOCAL_NAME' SOURCE_ETAG='${{ steps.compras_source.outputs.etag }}' bash -s" <<'REMOTE'
          set -euo pipefail
          DATA_DIR=/opt/financial-system-data/compras
          mkdir -p "$DATA_DIR"
          install -m 640 "/tmp/$DEV_COMPRAS_LOCAL_NAME" "$DATA_DIR/$DEV_COMPRAS_LOCAL_NAME"
          printf '%s\n' "$SOURCE_ETAG" > "$DATA_DIR/.source-etag"
          chmod 640 "$DATA_DIR/.source-etag"
          rm -f "/tmp/$DEV_COMPRAS_LOCAL_NAME"
          ls -lh "$DATA_DIR/$DEV_COMPRAS_LOCAL_NAME"
          REMOTE

      - name: Copy release to Lightsail
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "${{ steps.artifact.outputs.archive }}" \
            "${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}:/tmp/financial-system-release.tar.gz"

      - name: Bootstrap Lightsail development
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "sudo DEVELOPMENT_DOMAIN='$DEVELOPMENT_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/financial-system
          DATA_DIR=/opt/financial-system-data/compras
          mkdir -p "$APP_DIR/secrets" "$DATA_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            dnf install -y docker
          fi
          systemctl enable --now docker

          local_arch="$(uname -m)"
          case "$local_arch" in
            x86_64)
              compose_arch=x86_64
              buildx_arch=amd64
              ;;
            aarch64|arm64)
              compose_arch=aarch64
              buildx_arch=arm64
              ;;
            *)
              echo "Arquitectura no soportada para plugins Docker: $local_arch" >&2
              exit 2
              ;;
          esac

          mkdir -p /usr/local/lib/docker/cli-plugins

          if ! docker compose version >/dev/null 2>&1; then
            curl -fsSL \
              "https://github.com/docker/compose/releases/download/v2.40.1/docker-compose-linux-${compose_arch}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          curl -fsSL \
            "https://github.com/docker/buildx/releases/download/v0.29.1/buildx-v0.29.1.linux-${buildx_arch}" \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

          if [[ ! -f "$APP_DIR/.env.production" ]]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 48)"
            GOOGLE_SHEETS_CHANGE_SECRET="$(openssl rand -hex 32)"

            cat > "$APP_DIR/.env.production" <<EOF
          APP_ENV=development
          ASIATI_DOMAIN=${DEVELOPMENT_DOMAIN}
          POSTGRES_DB=financial_system
          POSTGRES_USER=asiati
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          CARTERA_COMPROBANTES_MAX_BYTES=10485760
          CARTERA_COMPROBANTES_MIME_TYPES=application/pdf,image/jpeg,image/png
          CARTERA_SHEETS_EMPRESA_ID=
          CARTERA_SHEETS_SPREADSHEET_ID=
          CARTERA_SHEETS_RANGE=
          CARTERA_SHEETS_MORA_RANGE=
          CARTERA_SHEETS_PROYECCION_RANGE=
          COMPRAS_DEMO_MODE=false
          COMPRAS_EXCEL_LOCAL_FILE=/data/compras/INFORME_COMPRAS_2024_2026_DEV.xlsx
          COMPRAS_LOCAL_DATA_DIR=/opt/financial-system-data/compras
          COMPRAS_SHEETS_EMPRESA_ID=1
          COMPRAS_SHEETS_SPREADSHEET_ID=
          COMPRAS_SHEETS_CO_RANGE="'INFORME CLIENTES (CO)'!A:BG"
          COMPRAS_SHEETS_EC_RANGE="'INFORME CLIENTES (EC)'!A:BG"
          COMPRAS_SHEETS_CL_RANGE="'INFORME CLIENTES (CL)'!A:BG"
          COMPRAS_SHEETS_SUPPLY_CHAIN_RANGE="'Supply Chain '!A:Z"
          COMPRAS_SHEETS_CACHE_SECONDS=60
          GOOGLE_SERVICE_ACCOUNT_FILE=./secrets/google-service-account.json
          BACKUP_INTERVAL_SECONDS=86400
          BACKUP_RETENTION_DAYS=14
          JWT_SECRET=${JWT_SECRET}
          LOGIN_MAX_INTENTOS_FALLIDOS=5
          LOGIN_VENTANA_MINUTOS=15
          SESION_DURACION_HORAS=8
          SESSION_COOKIE_SECURE=true
          GOOGLE_SHEETS_CHANGE_SECRET=${GOOGLE_SHEETS_CHANGE_SECRET}
          GOOGLE_SHEETS_DEBOUNCE_SECONDS=15
          GOOGLE_SHEETS_MAX_WAIT_SECONDS=60
          EOF
            chmod 600 "$APP_DIR/.env.production"
          fi

          if [[ ! -f "$APP_DIR/secrets/google-service-account.json" ]]; then
            printf '{}\n' > "$APP_DIR/secrets/google-service-account.json"
            chmod 600 "$APP_DIR/secrets/google-service-account.json"
          fi

          set_env() {
            local key="$1"
            local value="$2"
            local tmp
            tmp="$(mktemp)"
            awk -v key="$key" -v value="$value" '
              BEGIN { updated = 0 }
              index($0, key "=") == 1 {
                print key "=" value
                updated = 1
                next
              }
              { print }
              END {
                if (!updated) print key "=" value
              }
            ' "$APP_DIR/.env.production" > "$tmp"
            cat "$tmp" > "$APP_DIR/.env.production"
            rm -f "$tmp"
          }

          COGNITO_CLIENT_SECRET="$(cat /tmp/cognito-client-secret)"
          test -n "$COGNITO_CLIENT_SECRET"

          set_env AUTH_PROVIDER cognito
          set_env COGNITO_REGION "$COGNITO_REGION"
          set_env COGNITO_CLIENT_ID "$COGNITO_CLIENT_ID"
          set_env COGNITO_CLIENT_SECRET "$COGNITO_CLIENT_SECRET"
          set_env ASIATI_DOMAIN "$DEVELOPMENT_DOMAIN"
          set_env SESSION_COOKIE_SECURE true
          set_env COMPRAS_DEMO_MODE false
          set_env COMPRAS_EXCEL_LOCAL_FILE /data/compras/INFORME_COMPRAS_2024_2026_DEV.xlsx
          set_env COMPRAS_LOCAL_DATA_DIR /opt/financial-system-data/compras
          set_env COMPRAS_SHEETS_EMPRESA_ID 1
          set_env COMPRAS_SHEETS_CO_RANGE "\"'INFORME CLIENTES (CO)'!A:BG\""
          set_env COMPRAS_SHEETS_EC_RANGE "\"'INFORME CLIENTES (EC)'!A:BG\""
          set_env COMPRAS_SHEETS_CL_RANGE "\"'INFORME CLIENTES (CL)'!A:BG\""
          set_env COMPRAS_SHEETS_SUPPLY_CHAIN_RANGE "\"'Supply Chain '!A:Z\""
          chmod 600 "$APP_DIR/.env.production"
          rm -f /tmp/cognito-client-secret

          test -s "$DATA_DIR/INFORME_COMPRAS_2024_2026_DEV.xlsx"
          docker compose version
          docker buildx version
          REMOTE

      - name: Install release on Lightsail
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"
          CHECKSUM="${{ steps.artifact.outputs.sha256 }}"
          RELEASE_SHA="${{ steps.target.outputs.sha }}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "echo '$CHECKSUM  /tmp/financial-system-release.tar.gz' | sha256sum -c -"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "sudo sed -i 's|^ASIATI_DOMAIN=.*|ASIATI_DOMAIN=$DEVELOPMENT_DOMAIN|' /opt/financial-system/.env.production && sudo sed -i 's|^SESSION_COOKIE_SECURE=.*|SESSION_COOKIE_SECURE=true|' /opt/financial-system/.env.production"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "rm -rf /tmp/financial-system-release-inspect && mkdir -p /tmp/financial-system-release-inspect && tar -xzf /tmp/financial-system-release.tar.gz -C /tmp/financial-system-release-inspect && sudo bash /tmp/financial-system-release-inspect/ops/install_release_artifact.sh /tmp/financial-system-release.tar.gz '$RELEASE_SHA'"

      - name: Ensure development users
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/financial-system
          DC=(docker compose --env-file .env.production -f compose.production.yml)

          juan_role="$("${DC[@]}" exec -T db psql -U asiati -d financial_system -At \
            -c "SELECT rol FROM usuarios WHERE email='juan.parra@asiati.com.co';" </dev/null)"
          if [[ -z "$juan_role" ]]; then
            "${DC[@]}" run --rm -T \
              -e DEV_ADMIN_EMAIL=juan.parra@asiati.com.co \
              -e DEV_ADMIN_NAME="Juan Felipe Parra" \
              api python -m app.core.usuarios.asegurar_superadmin_dev </dev/null
            "${DC[@]}" exec -T db psql -U asiati -d financial_system -v ON_ERROR_STOP=1 \
              -c "UPDATE usuarios SET debe_cambiar_password=true WHERE email='juan.parra@asiati.com.co';" </dev/null
          elif [[ "$juan_role" != "super_administrador" ]]; then
            echo "Rol inesperado para Juan Felipe: $juan_role" >&2
            exit 1
          fi

          sistemas_role="$("${DC[@]}" exec -T db psql -U asiati -d financial_system -At \
            -c "SELECT rol FROM usuarios WHERE email='sistemas@asiati.com.co';" </dev/null)"
          if [[ -z "$sistemas_role" ]]; then
            "${DC[@]}" run --rm -T \
              -e DEV_ADMIN_EMAIL=sistemas@asiati.com.co \
              -e DEV_ADMIN_NAME="Adrian" \
              api python -m app.core.usuarios.asegurar_superadmin_dev </dev/null
            "${DC[@]}" exec -T db psql -U asiati -d financial_system -v ON_ERROR_STOP=1 \
              -c "UPDATE usuarios SET rol='ti', debe_cambiar_password=true WHERE email='sistemas@asiati.com.co';" </dev/null
          elif [[ "$sistemas_role" != "ti" ]]; then
            echo "Rol inesperado para Sistemas: $sistemas_role" >&2
            exit 1
          fi

          "${DC[@]}" exec -T db psql -U asiati -d financial_system -At \
            -c "SELECT email || '|' || rol || '|' || activo || '|' || debe_cambiar_password FROM usuarios WHERE email IN ('juan.parra@asiati.com.co','sistemas@asiati.com.co') ORDER BY email;" </dev/null
          REMOTE

      - name: Refresh Compras snapshot from local Excel
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"

          ssh             -o BatchMode=yes             -o StrictHostKeyChecking=accept-new             -i /tmp/lightsail.pem             "$SSH_TARGET"             "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/financial-system
          DC=(docker compose --env-file .env.production -f compose.production.yml)

          "${DC[@]}" run --rm -T api             python -m app.motores.compras_supply_chain.capturar_snapshot_dev
          REMOTE

      - name: Verify HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS "https://$DEVELOPMENT_DOMAIN/ready" | grep -q '"ready"'; then
              curl -fsS "https://$DEVELOPMENT_DOMAIN/health"
              exit 0
            fi
            sleep 5
          done
          echo "El entorno de desarrollo no pasó el healthcheck HTTPS." >&2
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Lightsail development deployment"
            printf '%s\n' "- Commit: ${{ steps.target.outputs.sha }}"
            printf '%s\n' "- Instance: $LIGHTSAIL_INSTANCE"
            printf '%s\n' "- Host: ${{ steps.ssh.outputs.host }}"
            printf '%s\n' "- URL: https://$DEVELOPMENT_DOMAIN/"
          } >> "$GITHUB_STEP_SUMMARY"
