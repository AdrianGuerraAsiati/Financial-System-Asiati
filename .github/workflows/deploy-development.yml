name: Deploy development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: development-lightsail
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::890876258895:role/financial-system-asiati-github-deploy
  LIGHTSAIL_INSTANCE: financial-system-asiati-dev
  LIGHTSAIL_HOST: 3.141.226.208
  DEVELOPMENT_DOMAIN: 3-141-226-208.sslip.io

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve deploy commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Build release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/financial-system-${{ steps.target.outputs.sha }}.tar.gz"

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=secrets \
            --exclude=fixtures \
            -czf "$ARCHIVE" .

          ARTIFACT_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get temporary Lightsail SSH access
        id: ssh
        shell: bash
        run: |
          set -euo pipefail
          DETAILS="$(
            aws lightsail get-instance-access-details \
              --region "$AWS_REGION" \
              --instance-name "$LIGHTSAIL_INSTANCE" \
              --protocol ssh
          )"

          USERNAME="$(jq -r '.accessDetails.username // empty' <<<"$DETAILS")"
          PRIVATE_KEY="$(jq -r '.accessDetails.privateKey // empty' <<<"$DETAILS")"
          CERT_KEY="$(jq -r '.accessDetails.certKey // empty' <<<"$DETAILS")"

          test -n "$USERNAME"
          test -n "$PRIVATE_KEY"

          printf '%s\n' "$PRIVATE_KEY" > /tmp/lightsail.pem
          chmod 600 /tmp/lightsail.pem
          ssh-keygen -y -f /tmp/lightsail.pem >/dev/null

          if [[ -n "$CERT_KEY" ]]; then
            printf '%s\n' "$CERT_KEY" > /tmp/lightsail.pem-cert.pub
            chmod 644 /tmp/lightsail.pem-cert.pub
          else
            rm -f /tmp/lightsail.pem-cert.pub
          fi

          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "host=$LIGHTSAIL_HOST" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if ssh \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=accept-new \
              -i /tmp/lightsail.pem \
              "${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}" \
              "echo ready" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Lightsail no aceptó SSH a tiempo." >&2
          exit 1

      - name: Copy release to Lightsail
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "${{ steps.artifact.outputs.archive }}" \
            "${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}:/tmp/financial-system-release.tar.gz"

      - name: Bootstrap Lightsail development
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "sudo DEVELOPMENT_DOMAIN='$DEVELOPMENT_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail

          APP_DIR=/opt/financial-system
          mkdir -p "$APP_DIR/secrets"

          if ! command -v docker >/dev/null 2>&1; then
            dnf install -y docker
          fi
          systemctl enable --now docker

          local_arch="$(uname -m)"
          case "$local_arch" in
            x86_64)
              compose_arch=x86_64
              buildx_arch=amd64
              ;;
            aarch64|arm64)
              compose_arch=aarch64
              buildx_arch=arm64
              ;;
            *)
              echo "Arquitectura no soportada para plugins Docker: $local_arch" >&2
              exit 2
              ;;
          esac

          mkdir -p /usr/local/lib/docker/cli-plugins

          if ! docker compose version >/dev/null 2>&1; then
            curl -fsSL \
              "https://github.com/docker/compose/releases/download/v2.40.1/docker-compose-linux-${compose_arch}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          if ! docker buildx version >/dev/null 2>&1; then
            curl -fsSL \
              "https://github.com/docker/buildx/releases/download/v0.29.1/buildx-v0.29.1.linux-${buildx_arch}" \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          fi

          if [[ ! -f "$APP_DIR/.env.production" ]]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 48)"
            GOOGLE_SHEETS_CHANGE_SECRET="$(openssl rand -hex 32)"

            cat > "$APP_DIR/.env.production" <<EOF
          APP_ENV=development
          ASIATI_DOMAIN=${DEVELOPMENT_DOMAIN}
          POSTGRES_DB=financial_system
          POSTGRES_USER=asiati
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          CARTERA_COMPROBANTES_MAX_BYTES=10485760
          CARTERA_COMPROBANTES_MIME_TYPES=application/pdf,image/jpeg,image/png
          CARTERA_SHEETS_EMPRESA_ID=
          CARTERA_SHEETS_SPREADSHEET_ID=
          CARTERA_SHEETS_RANGE=
          CARTERA_SHEETS_MORA_RANGE=
          CARTERA_SHEETS_PROYECCION_RANGE=
          COMPRAS_DEMO_MODE=true
          COMPRAS_SHEETS_EMPRESA_ID=
          COMPRAS_SHEETS_SPREADSHEET_ID=
          COMPRAS_SHEETS_CO_RANGE=
          COMPRAS_SHEETS_EC_RANGE=
          COMPRAS_SHEETS_CL_RANGE=
          COMPRAS_SHEETS_SUPPLY_CHAIN_RANGE=
          COMPRAS_SHEETS_CACHE_SECONDS=60
          GOOGLE_SERVICE_ACCOUNT_FILE=./secrets/google-service-account.json
          BACKUP_INTERVAL_SECONDS=86400
          BACKUP_RETENTION_DAYS=14
          JWT_SECRET=${JWT_SECRET}
          LOGIN_MAX_INTENTOS_FALLIDOS=5
          LOGIN_VENTANA_MINUTOS=15
          SESION_DURACION_HORAS=8
          SESSION_COOKIE_SECURE=true
          GOOGLE_SHEETS_CHANGE_SECRET=${GOOGLE_SHEETS_CHANGE_SECRET}
          GOOGLE_SHEETS_DEBOUNCE_SECONDS=15
          GOOGLE_SHEETS_MAX_WAIT_SECONDS=60
          EOF
            chmod 600 "$APP_DIR/.env.production"
          fi

          if [[ ! -f "$APP_DIR/secrets/google-service-account.json" ]]; then
            printf '{}\n' > "$APP_DIR/secrets/google-service-account.json"
            chmod 600 "$APP_DIR/secrets/google-service-account.json"
          fi

          sed -i "s|^ASIATI_DOMAIN=.*|ASIATI_DOMAIN=${DEVELOPMENT_DOMAIN}|" "$APP_DIR/.env.production"
          sed -i 's|^SESSION_COOKIE_SECURE=.*|SESSION_COOKIE_SECURE=true|' "$APP_DIR/.env.production"
          sed -i 's|^COMPRAS_SHEETS_CO_RANGE=.*|COMPRAS_SHEETS_CO_RANGE=|' "$APP_DIR/.env.production"
          sed -i 's|^COMPRAS_SHEETS_EC_RANGE=.*|COMPRAS_SHEETS_EC_RANGE=|' "$APP_DIR/.env.production"
          sed -i 's|^COMPRAS_SHEETS_CL_RANGE=.*|COMPRAS_SHEETS_CL_RANGE=|' "$APP_DIR/.env.production"
          sed -i 's|^COMPRAS_SHEETS_SUPPLY_CHAIN_RANGE=.*|COMPRAS_SHEETS_SUPPLY_CHAIN_RANGE=|' "$APP_DIR/.env.production"

          docker compose version
          docker buildx version
          REMOTE

      - name: Install release on Lightsail
        shell: bash
        run: |
          set -euo pipefail

          SSH_TARGET="${{ steps.ssh.outputs.username }}@${{ steps.ssh.outputs.host }}"
          CHECKSUM="${{ steps.artifact.outputs.sha256 }}"
          RELEASE_SHA="${{ steps.target.outputs.sha }}"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "echo '$CHECKSUM  /tmp/financial-system-release.tar.gz' | sha256sum -c -"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "sudo sed -i 's|^ASIATI_DOMAIN=.*|ASIATI_DOMAIN=$DEVELOPMENT_DOMAIN|' /opt/financial-system/.env.production && sudo sed -i 's|^SESSION_COOKIE_SECURE=.*|SESSION_COOKIE_SECURE=true|' /opt/financial-system/.env.production"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i /tmp/lightsail.pem \
            "$SSH_TARGET" \
            "rm -rf /tmp/financial-system-release-inspect && mkdir -p /tmp/financial-system-release-inspect && tar -xzf /tmp/financial-system-release.tar.gz -C /tmp/financial-system-release-inspect && sudo bash /tmp/financial-system-release-inspect/ops/install_release_artifact.sh /tmp/financial-system-release.tar.gz '$RELEASE_SHA'"

      - name: Verify HTTPS
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS "https://$DEVELOPMENT_DOMAIN/ready" | grep -q '"ready"'; then
              curl -fsS "https://$DEVELOPMENT_DOMAIN/health"
              exit 0
            fi
            sleep 5
          done
          echo "El entorno de desarrollo no pasó el healthcheck HTTPS." >&2
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Lightsail development deployment"
            printf '%s\n' "- Commit: ${{ steps.target.outputs.sha }}"
            printf '%s\n' "- Instance: $LIGHTSAIL_INSTANCE"
            printf '%s\n' "- Host: ${{ steps.ssh.outputs.host }}"
            printf '%s\n' "- URL: https://$DEVELOPMENT_DOMAIN/"
          } >> "$GITHUB_STEP_SUMMARY"
