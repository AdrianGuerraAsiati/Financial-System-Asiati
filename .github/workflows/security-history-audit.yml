name: Security history audit

on:
  push:
    branches:
      - main
      - security/history-secret-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          git fetch origin '+refs/pull/*/head:refs/remotes/pull/*/head'
          echo "Commits reachable from branches, tags and PR refs: $(git rev-list --all --count)"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"

          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSLo /tmp/gitleaks_checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"

          (
            cd /tmp
            grep " $ARCHIVE$" gitleaks_checksums.txt | sha256sum -c -
          )

          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/$ARCHIVE" -C /tmp/gitleaks gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks version


      - name: Reject historically tracked raw/sensitive files
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess

          output = subprocess.check_output(
              ["git", "log", "--all", "--name-only", "--pretty=format:"],
              text=True,
          )
          paths = sorted({line.strip() for line in output.splitlines() if line.strip()})

          allowed = {
              ".env.example",
              ".env.production.example",
          }
          forbidden = re.compile(
              r"(^|/)(fixtures?|secrets?)/"
              r"|(^|/)\.env($|\.)"
              r"|\.(xlsx?|csv|parquet|sqlite3?|db|dump|pem|key|p12|pfx)$",
              re.IGNORECASE,
          )

          findings = [
              path
              for path in paths
              if forbidden.search(path) and path not in allowed
          ]

          if findings:
              print("Archivos sensibles/raw encontrados en el historial:")
              for path in findings:
                  print("-", path)
              raise SystemExit(1)

          print("No hay archivos raw/secretos prohibidos en refs auditadas.")
          PY

      - name: Scan all Git history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1 \
            --no-banner

      - name: Summarize findings
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("/tmp/gitleaks-report.json")
          findings = json.loads(report.read_text()) if report.exists() else []

          print(f"Secret findings: {len(findings)}")
          for item in findings:
              print(
                  "-",
                  item.get("RuleID") or item.get("Description"),
                  "| file:", item.get("File"),
                  "| commit:", (item.get("Commit") or "")[:12],
              )
          PY
