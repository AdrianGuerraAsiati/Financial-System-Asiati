name: Security history audit

on:
  push:
    branches:
      - security/history-secret-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          echo "Commits reachable from all refs: $(git rev-list --all --count)"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"

          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSLo /tmp/gitleaks_checksums.txt "$BASE/gitleaks_${VERSION}_checksums.txt"

          (
            cd /tmp
            grep " $ARCHIVE$" gitleaks_checksums.txt | sha256sum -c -
          )

          mkdir -p /tmp/gitleaks
          tar -xzf "/tmp/$ARCHIVE" -C /tmp/gitleaks gitleaks
          chmod +x /tmp/gitleaks/gitleaks
          /tmp/gitleaks/gitleaks version

      - name: Scan all Git history
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks/gitleaks git . \
            --log-opts="--all" \
            --redact \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            --exit-code 1 \
            --no-banner

      - name: Summarize findings
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("/tmp/gitleaks-report.json")
          findings = json.loads(report.read_text()) if report.exists() else []

          print(f"Secret findings: {len(findings)}")
          for item in findings:
              print(
                  "-",
                  item.get("RuleID") or item.get("Description"),
                  "| file:", item.get("File"),
                  "| commit:", (item.get("Commit") or "")[:12],
              )
          PY
