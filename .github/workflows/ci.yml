name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q tests --ignore-glob="tests/test_core_*.py"

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financial_system
          POSTGRES_USER: asiati
          POSTGRES_PASSWORD: asiati
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asiati -d financial_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://asiati:asiati@localhost:5432/financial_system

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Migrate database
        run: alembic upgrade head

      - name: Integration tests
        run: pytest -q tests/test_core_*.py
